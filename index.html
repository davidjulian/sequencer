<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequencer Tool</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .instructor, .student {
            display: none;
        }
        .show {
            display: grid;
        }
    </style>
</head>
<body class="home-page">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <main id="main-content">
    <h1>Welcome to the Sequencer Tool</h1>
    <p>Are you a student or an instructor?</p>
    <div class="home-actions">
        <button id="studentBtn" class="button" type="button">Student</button>
        <button id="instructorBtn" class="button" type="button" aria-expanded="false" aria-controls="instructorTools">Instructor</button>
    </div>

    <div class="student">
        <!-- Removed the "Go to Student Tool" button as it's now redundant -->
    </div>

    <div id="instructorTools" class="instructor home-actions" aria-label="Instructor tools">
        <a href="build_tool.html" class="button">Go to Build Tool</a>
        <a href="analyze_tool.html" class="button">Go to Analyze Tool</a>
    </div>
    </main>

    <script src="sequencer_ui.js"></script>
    <script>
        document.getElementById('studentBtn').addEventListener('click', function() {
            window.location.href = 'student_tool.html'; // Direct navigation to student tool
        });

        document.getElementById('instructorBtn').addEventListener('click', function() {
            document.querySelector('.instructor').classList.add('show');
            this.setAttribute('aria-expanded', 'true');
        });
    </script>

<footer>
    <p>&copy; 2026 David Julian, University of Florida</p>
    <p><button type="button" class="link-button" onclick="SequencerUI.openAboutDialog()">About</button> | <button type="button" class="link-button" onclick="SequencerUI.openTermsDialog()">Terms of Service</button></p>
</footer>

</body>
</html>
